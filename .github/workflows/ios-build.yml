name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'client/ios/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      # No signing identity here on purpose: this produces an unsigned .app.
      # Sideloadly/AltServer do the actual code-signing locally on your own
      # machine using your Apple ID, which is what lets a free Apple ID
      # install it without a $99/year developer account.
      - name: Build unsigned .app
        working-directory: client/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package as .ipa
        working-directory: client/ios/App
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Wave-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Wave-unsigned-ipa
          path: client/ios/App/Wave-unsigned.ipa

      # GitHub Actions artifacts require signing in to GitHub to download,
      # even on a public repo. A release asset doesn't, so re-publish the
      # same .ipa as a rolling "latest-ios" release each build - that gives
      # a stable, no-login link to hand straight to Sideloadly/AltServer.
      #
      # Update-in-place instead of delete+create: a delete that hits a
      # transient GitHub API error (seen in practice as an HTTP 500 from
      # the releases endpoint) leaves the old release behind, and the
      # following create then fails with "a release with the same tag
      # name already exists". Editing/uploading to the existing release
      # avoids depending on delete succeeding at all.
      - name: Publish as a rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Unsigned build from commit ${{ github.sha }}. Sign and install with Sideloadly or AltServer using your Apple ID."
          if gh release view latest-ios >/dev/null 2>&1; then
            gh release upload latest-ios client/ios/App/Wave-unsigned.ipa --clobber
            gh release edit latest-ios --title "Wave iOS (unsigned)" --notes "$NOTES"
          else
            gh release create latest-ios client/ios/App/Wave-unsigned.ipa \
              --title "Wave iOS (unsigned)" \
              --notes "$NOTES" \
              --latest=false
          fi
