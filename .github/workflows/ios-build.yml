name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'client/ios/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      # No signing identity here on purpose: this produces an unsigned .app.
      # Sideloadly/AltServer do the actual code-signing locally on your own
      # machine using your Apple ID, which is what lets a free Apple ID
      # install it without a $99/year developer account.
      - name: Build unsigned .app
        working-directory: client/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package as .ipa
        working-directory: client/ios/App
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Wave-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Wave-unsigned-ipa
          path: client/ios/App/Wave-unsigned.ipa

      # GitHub Actions artifacts require signing in to GitHub to download,
      # even on a public repo. A release asset doesn't, so publish the
      # .ipa as a release each build - that gives a stable, no-login link
      # to hand straight to Sideloadly/AltServer.
      #
      # A fixed "latest-ios" tag was tried first (delete old + create new
      # each run), but the underlying release object got stuck returning
      # HTTP 500 from GitHub's API on every delete/edit/upload attempt
      # against it. Sidestepping that entirely: create a fresh, uniquely
      # tagged release every run (never touching any prior release), and
      # mark it `--latest` so the permanent, run-independent download URL
      # is GitHub's own "latest release" alias:
      #   https://github.com/<owner>/<repo>/releases/latest/download/Wave-unsigned.ipa
      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios-${{ github.run_number }}" client/ios/App/Wave-unsigned.ipa \
            --title "Wave iOS (unsigned) build ${{ github.run_number }}" \
            --notes "Unsigned build from commit ${{ github.sha }}. Sign and install with Sideloadly or AltServer using your Apple ID." \
            --latest
