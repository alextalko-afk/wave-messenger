name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web client dependencies
        working-directory: client
        run: npm ci

      - name: Build web assets
        working-directory: client
        run: npm run build

      - name: Sync Capacitor iOS project
        working-directory: client
        run: npx cap sync ios

      # @capacitor/app and @capacitor/splash-screen ship Swift source that
      # calls Capacitor Swift APIs (CAPPluginCall.reject, PluginConfig
      # .getString, bridge.viewController, ...) that no longer exist in the
      # capacitor-swift-pm runtime, so they fail to compile no matter which
      # core version they're paired with. Neither plugin does anything
      # essential on iOS (hardware back button, native splash screen), so
      # drop them from the SPM dependency graph before building - their JS
      # calls just no-op/reject instead of crashing the build. This only
      # touches the CI-generated file, not anything committed to git, so
      # Android/web keep using both plugins normally.
      - name: Drop incompatible plugins from the iOS build
        working-directory: client/ios/App/CapApp-SPM
        run: |
          cat > Package.swift <<'EOF'
          // swift-tools-version: 5.9
          import PackageDescription

          let package = Package(
              name: "CapApp-SPM",
              platforms: [.iOS(.v15)],
              products: [
                  .library(
                      name: "CapApp-SPM",
                      targets: ["CapApp-SPM"])
              ],
              dependencies: [
                  .package(url: "https://github.com/ionic-team/capacitor-swift-pm.git", exact: "8.1.0")
              ],
              targets: [
                  .target(
                      name: "CapApp-SPM",
                      dependencies: [
                          .product(name: "Capacitor", package: "capacitor-swift-pm"),
                          .product(name: "Cordova", package: "capacitor-swift-pm")
                      ]
                  )
              ]
          )
          EOF

      # No signing identity here on purpose: this produces an unsigned .app.
      # Sideloadly/AltServer do the actual code-signing locally on your own
      # machine using your Apple ID, which is what lets a free Apple ID
      # install it without a $99/year developer account.
      - name: Build unsigned .app
        working-directory: client/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package as .ipa
        working-directory: client/ios/App
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Wave-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Wave-unsigned-ipa
          path: client/ios/App/Wave-unsigned.ipa

      # GitHub Actions artifacts require signing in to GitHub to download,
      # even on a public repo. A release asset doesn't, so re-publish the
      # same .ipa as a rolling "latest-ios" release each build - that gives
      # a stable, no-login link to hand straight to Sideloadly/AltServer.
      - name: Publish as a rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-ios --yes --cleanup-tag || true
          gh release create latest-ios client/ios/App/Wave-unsigned.ipa \
            --title "Wave iOS (unsigned)" \
            --notes "Unsigned build from commit ${{ github.sha }}. Sign and install with Sideloadly or AltServer using your Apple ID." \
            --latest=false
