name: Build Native Android APK

on:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android-native

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: android-native

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wave-native-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk

      # Actions artifacts require a GitHub login to download even on a
      # public repo; a release asset doesn't, so publish one each build
      # for a stable, no-login link - same pattern as the iOS workflow.
      - name: Rename APK for release
        run: cp android-native/app/build/outputs/apk/debug/app-debug.apk Wave-native-debug.apk

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-native-${{ github.run_number }}" Wave-native-debug.apk \
            --title "Wave Android native (debug) build ${{ github.run_number }}" \
            --notes "Debug build from commit ${{ github.sha }}. Install directly (enable \"install unknown apps\" for your browser/file manager)." \
            --latest=false
